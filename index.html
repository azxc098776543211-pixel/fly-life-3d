
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>حياة الذبابة 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;z-index:5;pointer-events:none}
.panel{background:#101b2bdc;padding:9px 13px;border-radius:12px;font-weight:bold;font-size:14px}
#health{color:#ff7777}
#controls{position:fixed;bottom:18px;left:0;right:0;height:155px;z-index:6;pointer-events:none}
#joy{position:absolute;left:20px;bottom:5px;width:125px;height:125px;border-radius:50%;background:#ffffff30;border:3px solid #ffffff88;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:35px;top:35px;width:49px;height:49px;border-radius:50%;background:#ffffffbb;border:2px solid white}
.btn{position:absolute;pointer-events:auto;border:2px solid #ffffff99;border-radius:50%;color:white;font-weight:bold;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
#fire{right:22px;bottom:15px;width:76px;height:76px;background:#e33b3bdc;font-size:17px}
#up{right:112px;bottom:88px;width:53px;height:53px;background:#258bd5dd;font-size:23px}
#down{right:112px;bottom:25px;width:53px;height:53px;background:#258bd5dd;font-size:23px}
#message{pos
#overlay{display:none;position:fixed;inset:0;background:#07111ddd;z-index:10;align-items:center;justify-content:center;text-align:center}
#overlay div{background:#18283b;padding:25px;border-radius:18px;width:85%;max-width:330px}
#overlay button{background:#20a56b;color:white;border:0;border-radius:10px;padding:13px 25px;font-size:18px;margin-top:12px}
#error{display:none;position:fixed;inset:0;background:#180d0d;color:white;padding:25px;z-index:30;direction:ltr;overflow:auto}
</style>
</head>
<body>
<div id="hud">
 <div class="panel">❤️ <span id="hp">100</span></div>
 <div class="panel">⭐ النقاط: <span id="score">0</span></div>
 <div class="panel">🏆 المرحلة: <span id="level">1</span></div>
</div>
<div id="message">🪰 استعد للقتال!</div>

<div id="controls">
 <div id="joy"><div id="stick"></div></div>
 <div class="btn" id="fire">🔫 رمي</div>
 <div class="btn" id="up">⬆️</div>
 <div class="btn" id="down">⬇️</div>
</div>

<div id="overlay">
 <div>
  <h1 id="endTitle">انتهت اللعبة!</h1>
  <p id="endText">حاول مرة ثانية</p>
  <button onclick="restartGame()">العب من جديد</button>
 </div>
</div>
<div id="error"></div>

<script>
window.addEventListener('error',e=>{
 const box=document.getElementById('error');
 box.style.display='block';
 box.innerHTML='<h2>حدث خطأ في اللعبة</h2><p>'+String(e.message||'خطأ غير معروف')+'</p><p>تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.</p>';
});
window.addEventListener('unhandledrejection',e=>{
 const box=document.getElementById('error');
 box.style.display='block';
 box.innerHTML='<h2>تعذر تحميل اللعبة</h2><p>'+String(e.reason)+'</p><p>تأكد من اتصال الإنترنت.</p>';
});
</script>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,35,100);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,180);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526b37,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(15,30,10);
scene.add(sun);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(180,180),
 new THREE.MeshStandardMaterial({color:0x55a34d})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-1;
scene.add(ground);

const grid=new THREE.GridHelper(180,45,0x397c36,0x498b40);
grid.position.y=-0.98;
scene.add(grid);

// أشجار العالم
for(let i=0;i<45;i++){
 const x=(Math.random()-.5)*110;
 const z=(Math.random()-.5)*110;
 if(Math.abs(x)<10&&Math.abs(z)<15)continue;
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.4,2,7),
  new THREE.MeshStandardMaterial({color:0x76502c})
 );
 trunk.position.set(x,0,z);
 scene.add(trunk);
 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(1.6,8,7),
  new THREE.MeshStandardMaterial({color:0x237b36})
 );
 leaves.position.set(x,1.5,z);
 scene.add(leaves);
}

// إنشاء الذبابة
const fly=new THREE.Group();
scene.add(fly);
const black=new THREE.MeshStandardMaterial({color:0x20242a});
const dark=new THREE.MeshStandardMaterial({color:0x343b42});
const wingMat=new THREE.MeshStandardMaterial({color:0xbceaff,transparent:true,opacity:.65,side:THREE.DoubleSide});
const eyeMat=new THREE.MeshStandardMaterial({color:0xff2020});

function sphere(parent,x,y,z,sx,sy,sz,mat){
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),mat);
 m.position.set(x,y,z);
 m.scale.set(sx,sy,sz);
 parent.add(m);
 return m;
}
sphere(fly,0,0,0,.42,.38,.62,black);
sphere(fly,0,.05,-.65,.35,.32,.32,dark);
sphere(fly,-.18,.18,-.83,.12,.13,.1,eyeMat);
sphere(fly,.18,.18,-.83,.12,.13,.1,eyeMat);

const wings=[];
for(const side of [-1,1]){
 const w=sphere(fly,side*.48,.42,-.05,.55,.035,.23,wingMat);
 w.rotation.z=side*.25;
 wings.push(w);
 for(let i=0;i<3;i++){
  const leg=new THREE.Mesh(
   new THREE.CylinderGeometry(.025,.025,.65,5),
   black
  );
  leg.position.set(side*.25,-.38,(i-1)*.28);
  leg.rotation.z=side*.7;
  fly.add(leg);
 }
}
fly.position.set(0,2,8);

// الأعداء
let enemies=[];
let shots=[];
let score=0,level=1,hp=100;
let gameOver=false;
let fireHeld=false,upHeld=false,downHeld=false;
let joyX=0,joyY=0;
let shotTimer=0,damageTimer=0;
const clock=new THREE.Clock();

function makeEnemy(boss=false){
 const g=new THREE.Group();
 const bodyMat=new THREE.MeshStandardMaterial({color:boss?0x7b28a8:0x9b5b22});
 sphere(g,0,0,0,boss?.85:.42,boss?.7:.35,boss?.65:.42,bodyMat);
 sphere(g,0,.12,-.42,boss?.5:.27,boss?.4:.23,boss?.4:.25,black);
 for(const s of [-1,1]){
  sphere(g,s*.18,.25,-.58,.09,.1,.08,eyeMat);
  const wing=sphere(g,s*.48,.4,0,boss?.65:.35,.035,.2,wingMat);
  wing.rotation.z=s*.3;
 }
 g.position.set((Math.random()-.5)*24,2,-22-Math.random()*12);
 scene.add(g);
 enemies.push({mesh:g,boss,hp:boss?12:2,speed:boss?1.5:2.3,hit:0});
}

function spawnWave(){
 const boss=level%3===0;
 const count=boss?1:Math.min(3+level,9);
 for(let i=0;i<count;i++)makeEnemy(boss);
 document.getElementById('message').textContent=boss?'👑 ظهر الزعيم!':'⚔️ موجة جديدة!';
 setTimeout(()=>{document.getElementById('message').textContent='دافع عن نفسك وأطلق النار!'},1800);
}
spawnWave();

function shoot(){
 let target=null,dist=Infinity;
 for(const e of enemies){
  const d=fly.position.distanceTo(e.mesh.position);
  if(d<dist){dist=d;target=e;}
 }
 let direction=new THREE.Vector3(0,0,-1);
 if(target){
  direction.copy(target.mesh.position).sub(fly.position).normalize();
 }
 const ball=new THREE.Mesh(
  new THREE.SphereGeometry(.13,8,8),
  new THREE.MeshBasicMaterial({color:0xffee55})
 );
 ball.position.copy(fly.position);
 scene.add(ball);
 shots.push({mesh:ball,dir:direction,life:2.5});
}

function updateHUD(){
 document.getElementById('hp').textContent=hp;
 document.getElementById('score').textContent=score;
 document.getElementById('level').textContent=level;
}

function endGame(){
 gameOver=true;
 document.getElementById('endTitle').textContent='انتهت اللعبة!';
 document.getElementById('endText').textContent='نقاطك: '+score;
 document.getElementById('overlay').style.display='flex';
}

function restartGame(){
 for(const e of enemies)scene.remove(e.mesh);
 for(const s of shots)scene.remove(s.mesh);
 enemies=[];shots=[];
 score=0;level=1;hp=100;gameOver=false;
 fly.position.set(0,2,8);
 updateHUD();
 document.getElementById('overlay').style.display='none';
 spawnWave();
}

// الجير
const joy=document.getElementById('joy');
const stick=document.getElementById('stick');
let joyPointer=null;
function setJoy(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const max=42;
 const len=Math.hypot(x,y);
 if(len>max){x=x/len*max;y=y/len*max;}
 joyX=x/max;joyY=y/max;
 stick.style.transform=`translate(${x}px,${y}px)`;
}
joy.addEventListener('pointerdown',e=>{
 joyPointer=e.pointerId;
 joy.setPointerCapture(e.pointerId);
 setJoy(e);
});
joy.addEventListener('pointermove',e=>{
 if(e.pointerId===joyPointer)setJoy(e);
});
function releaseJoy(){
 joyPointer=null;joyX=0;joyY=0;
 stick.style.transform='translate(0px,0px)';
}
joy.addEventListener('pointerup',releaseJoy);
joy.addEventListener('pointercancel',releaseJoy);

function holdButton(id,setter){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();setter(true);
 });
 el.addEventListener('pointerup',()=>setter(false));
 el.addEventListener('pointercancel',()=>setter(false));
 el.addEventListener('pointerleave',()=>setter(false));
}
holdButton('fire',v=>fireHeld=v);
holdButton('up',v=>upHeld=v);
holdButton('down',v=>downHeld=v);

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(!gameOver){
  // الحركة
  fly.position.x+=joyX*10*dt;
  fly.position.z+=joyY*10*dt;
  if(upHeld)fly.position.y+=7*dt;
  if(downHeld)fly.position.y-=7*dt;
  fly.position.x=THREE.MathUtils.clamp(fly.position.x,-35,35);
  fly.position.z=THREE.MathUtils.clamp(fly.position.z,-30,25);
  fly.position.y=THREE.MathUtils.clamp(fly.position.y,.8,12);
  fly.rotation.z=-joyX*.3;
  fly.rotation.x=joyY*.15;

  // حركة الأجنحة
  const t=performance.now()*.025;
  wings[0].rotation.z=Math.sin(t)*.8-.3;
  wings[1].rotation.z=-Math.sin(t)*.8+.3;

  // كاميرا خلف الذبابة
  const camPos=new THREE.Vector3(
   fly.position.x,
   fly.position.y+4,
   fly.position.z+9
  );
  camera.position.lerp(camPos,1-Math.pow(.001,dt));
  camera.lookAt(fly.position.x,fly.position.y,fly.position.z-5);

  // الرمي المستمر
  shotTimer-=dt;
  if(fireHeld&&shotTimer<=0){
   shoot();shotTimer=.22;
  }

  // حركة المقذوفات
  for(let i=shots.length-1;i>=0;i--){
   const s=shots[i];
   s.mesh.position.addScaledVector(s.dir,24*dt);
   s.life-=dt;
   let remove=s.life<=0;
   for(let j=enemies.length-1;j>=0&&!remove;j--){
    const e=enemies[j];
    if(s.mesh.position.distanceTo(e.mesh.position)<1.1){
     e.hp--;
     remove=true;
     if(e.hp<=0){
      score+=e.boss?100:10;
      scene.remove(e.mesh);
      enemies.splice(j,1);
      updateHUD();
     }
    }
   }
   if(remove){
    scene.remove(s.mesh);
    shots.splice(i,1);
   }
  }

  // الأعداء يقتربون من الذبابة
  damageTimer-=dt;
  for(const e of enemies){
   const dir=new THREE.Vector3().subVectors(fly.position,e.mesh.position).normalize();
   e.mesh.position.addScaledVector(dir,e.speed*dt);
   e.mesh.lookAt(fly.position);
   if(e.mesh.position.distanceTo(fly.position)<1.25&&damageTimer<=0){
    hp-=e.boss?12:7;
    damageTimer=.55;
    updateHUD();
    if(hp<=0){hp=0;updateHUD();endGame();}
   }
  }

  // نهاية الموجة
  if(enemies.length===0){
   level++;
   hp=Math.min(100,hp+15);
   updateHUD();
   spawnWave();
  }
 }
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
</script>
</body>
</html>
