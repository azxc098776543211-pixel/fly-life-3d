
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fly Life 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;color:white;z-index:3;pointer-events:none}
.panel{background:#111c;padding:10px;border-radius:12px;font-size:14px}
#bossPanel{position:fixed;top:65px;left:50%;transform:translateX(-50%);width:70%;text-align:center;color:white;z-index:3}
#bar{height:13px;background:#333;border:1px solid white;border-radius:20px;overflow:hidden;margin-top:5px}
#bossFill{height:100%;width:100%;background:#f33}
#controls{position:fixed;inset:0;pointer-events:none;z-index:4}
#base{position:absolute;left:22px;bottom:25px;width:135px;height:135px;border:2px solid #ffffff99;background:#ffffff22;border-radius:50%;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:39px;top:39px;width:53px;height:53px;background:#eee;border-radius:50%;border:2px solid white}
.btn{position:absolute;right:22px;bottom:35px;width:70px;height:70px;border-radius:50%;background:#bd3030;color:white;border:2px solid white;font-size:25px;pointer-events:auto;touch-action:none}
#up,#down{width:48px;height:48px;background:#2364a0}
#up{bottom:115px}
#down{bottom:58px}
#shoot{font-size:30px}
#msg{display:none;position:fixed;z-index:8;top:40%;left:50%;transform:translate(-50%,-50%);background:#111e;color:white;padding:20px;border-radius:15px;text-align:center;font-size:22px}
#help{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);color:white;font-size:11px;z-index:3;white-space:nowrap}
</style>
</head>
<body>
<div id="hud">
<div class="panel">🪰 حياة الذبابة<br>المرحلة: <b id="stage">1</b></div>
<div class="panel">❤️ الصحة: <b id="health">100</b><br>⭐ النقاط: <b id="score">0</b></div>
</div>
<div id="bossPanel">👹 <span id="bossName">الزعيم الصغير</span><div id="bar"><div id="bossFill"></div></div></div>
<div id="msg"></div>
<div id="controls">
<div id="base"><div id="stick"></div></div>
<button class="btn" id="shoot">●</button>
<button class="btn" id="up">⬆</button>
<button class="btn" id="down">⬇</button>
</div>
<div id="help">اسحب الجير للحركة • الأسهم للارتفاع • ● للرمي</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91cce8);
scene.fog=new THREE.Fog(0x91cce8,25,70);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x667744,2));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(8,15,8);
scene.add(light);

const ground=new THREE.Mesh(
new THREE.BoxGeometry(42,1,42),
new THREE.MeshStandardMaterial({color:0x70a84d})
);
ground.position.y=-.5;
scene.add(ground);

const fly=new THREE.Group();
scene.add(fly);

const dark=new THREE.MeshStandardMaterial({color:0x22222b});
const body=new THREE.Mesh(new THREE.SphereGeometry(.35,16,16),dark);
body.scale.set(.8,.8,1.5);
fly.add(body);

const head=new THREE.Mesh(new THREE.SphereGeometry(.23,16,16),dark);
head.position.z=.42;
fly.add(head);

const wings=[];
const wingMat=new THREE.MeshStandardMaterial({
color:0xe5f4ff,transparent:true,opacity:.7
});

for(const s of [-1,1]){
const w=new THREE.Mesh(new THREE.SphereGeometry(.25,12,12),wingMat);
w.scale.set(1.5,.1,.5);
w.position.set(s*.35,.2,0);
fly.add(w);
wings.push(w);
}

fly.position.set(0,2,8);

const foods=[];
const foodMat=new THREE.MeshStandardMaterial({color:0xffd12e,emissive:0x553300});

for(let i=0;i<20;i++){
const f=new THREE.Mesh(new THREE.SphereGeometry(.22,12,12),foodMat);
f.position.set((Math.random()-.5)*32,.5+Math.random()*5,(Math.random()-.5)*30);
scene.add(f);
foods.push(f);
}

let stage=1;
let health=100;
let score=0;
let bossHP=30;
let bossMax=30;
let gameOver=false;
let victory=false;

const bossNames=[
'الزعيم الصغير',
'الذبابة المدرعة',
'ملكة الحشرات'
];

const bossColors=[0x823ac7,0x2477ad,0x9d263b];

const boss=new THREE.Group();
scene.add(boss);

function updateUI(){
document.getElementById('stage').textContent=stage;
document.getElementById('health').textContent=Math.ceil(health);
document.getElementById('score').textContent=score;
document.getElementById('bossName').textContent=bossNames[stage-1];
document.getElementById('bossFill').style.width=
Math.max(0,bossHP/bossMax*100)+'%';
}

function createBoss(){
while(boss.children.length)boss.remove(boss.children[0]);

const material=new THREE.MeshStandardMaterial({
color:bossColors[stage-1]
});

const shell=new THREE.Mesh(
new THREE.SphereGeometry(stage===3?1.25:.95,18,18),
material
);
shell.scale.set(1.3,1,1.25);
boss.add(shell);

const face=new THREE.Mesh(
new THREE.SphereGeometry(.4,14,14),
new THREE.MeshStandardMaterial({color:0x222222})
);
face.position.z=.85;
boss.add(face);

for(const s of [-1,1]){
const eye=new THREE.Mesh(
new THREE.SphereGeometry(.13,10,10),
new THREE.MeshStandardMaterial({
color:0xff1111,
emissive:0x880000
})
);
eye.position.set(s*.25,.18,1.18);
boss.add(eye);

for(let j=0;j<3;j++){
const leg=new THREE.Mesh(
new THREE.CylinderGeometry(.05,.08,.9,7),
material
);
leg.position.set(s*.85,-.4,(j-1)*.5);
leg.rotation.z=s*.65;
boss.add(leg);
}
}

boss.position.set(0,2,-10);

bossMax=stage===1?30:stage===2?55:85;
bossHP=bossMax;
updateUI();
}

function message(text){
const el=document.getElementById('msg');
el.innerHTML=text;
el.style.display='block';
}

function nextStage(){
if(stage<3){
stage++;
score+=100;
createBoss();
message('🏆 فزت على الزعيم!<br>المرحلة '+stage);

setTimeout(()=>{
document.getElementById('msg').style.display='none';
},1700);
}else{
victory=true;
message('🎉 انتصرت!<br>أنهيت جميع المراحل!<br><button onclick="location.reload()">العب من جديد</button>');
}
updateUI();
}

const shots=[];
const shotMaterial=new THREE.MeshStandardMaterial({
color:0x83f5ff,
emissive:0x1688bb
});

function shoot(){
if(gameOver||victory)return;

const p=new THREE.Mesh(
new THREE.SphereGeometry(.16,10,10),
shotMaterial
);

p.position.copy(fly.position);
scene.add(p);
shots.push({mesh:p,life:0});
}

const keys={};

addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
if(e.code==='Space')shoot();
});

addEventListener('keyup',e=>{
keys[e.key.toLowerCase()]=false;
});

let move={x:0,y:0};
let pointer=null;

const base=document.getElementById('base');
const stick=document.getElementById('stick');

function moveStick(e){
const r=base.getBoundingClientRect();

let dx=e.clientX-(r.left+r.width/2);
let dy=e.clientY-(r.top+r.height/2);

const max=48;
const len=Math.hypot(dx,dy);

if(len>max){
dx=dx/len*max;
dy=dy/len*max;
}

move.x=dx/max;
move.y=dy/max;

stick.style.transform=
'translate('+dx+'px,'+dy+'px)';
}

base.addEventListener('pointerdown',e=>{
pointer=e.pointerId;
base.setPointerCapture(pointer);
moveStick(e);
});

base.addEventListener('pointermove',e=>{
if(e.pointerId===pointer)moveStick(e);
});

function release(e){
if(e.pointerId===pointer){
pointer=null;
move={x:0,y:0};
stick.style.transform='translate(0,0)';
}
}

base.addEventListener('pointerup',release);
base.addEventListener('pointercancel',release);

let vertical=0;

function hold(id,value){
const b=document.getElementById(id);

b.addEventListener('pointerdown',e=>{
e.preventDefault();
vertical=value;
b.setPointerCapture(e.pointerId);
});

for(const ev of ['pointerup','pointercancel','pointerleave']){
b.addEventListener(ev,()=>{
if(vertical===value)vertical=0;
});
}
}

hold('up',1);
hold('down',-1);

document.getElementById('shoot').addEventListener('pointerdown',e=>{
e.preventDefault();
shoot();
});

createBoss();

const clock=new THREE.Clock();

function animate(){
requestAnimationFrame(animate);

const dt=Math.min(clock.getDelta(),.04);
const t=clock.elapsedTime;

if(!gameOver&&!victory){

let x=move.x+
(keys.a||keys.arrowleft?-1:0)+
(keys.d||keys.arrowright?1:0);

let z=move.y+
(keys.w||keys.arrowup?-1:0)+
(keys.s||keys.arrowdown?1:0);

fly.position.x+=x*.12;
fly.position.z+=z*.12;

let y=vertical;

if(keys.e||keys[' '])y=1;
if(keys.q||keys.shift)y=-1;

fly.position.y+=y*.1;

fly.position.x=THREE.MathUtils.clamp(fly.position.x,-19,19);
fly.position.z=THREE.MathUtils.clamp(fly.position.z,-19,19);
fly.position.y=THREE.MathUtils.clamp(fly.position.y,.6,9);

if(Math.abs(x)+Math.abs(z)>.05){
fly.rotation.y=Math.atan2(x,-z);
}

wings.forEach((w,i)=>{
w.rotation.z=Math.sin(t*22)*(i?1:-1)*.7;
});

// جمع الطعام
for(let i=foods.length-1;i>=0;i--){
foods[i].rotation.y+=dt*2;

if(fly.position.distanceTo(foods[i].position)<.75){
scene.remove(foods[i]);
foods.splice(i,1);
score+=10;
updateUI();
}
}

// حركة الزعيم
boss.position.x=Math.sin(t*.7+stage)*2.3;
boss.position.y=2+Math.sin(t*2)*.25;

// اصطدام الزعيم بالذبابة
if(boss.position.distanceTo(fly.position)<1.8){
health-=dt*10;
updateUI();

if(health<=0){
health=0;
gameOver=true;
message('انتهت اللعبة<br><button onclick="location.reload()">حاول مرة ثانية</button>');
}
}

// المقذوفات
for(let i=shots.length-1;i>=0;i--){

const s=shots[i];
s.life+=dt;

s.mesh.position.z-=dt*19;

s.mesh.position.x+=
(boss.position.x-s.mesh.position.x)*dt*.12;

if(s.mesh.position.distanceTo(boss.position)<1.35){

bossHP-=10;
score+=5;

scene.remove(s.mesh);
shots.splice(i,1);

updateUI();

if(bossHP<=0){
nextStage();
}
continue;
}

if(s.life>2.5){
scene.remove(s.mesh);
shots.splice(i,1);
}
}
}

// الكاميرا
const target=new THREE.Vector3(
fly.position.x,
fly.position.y+3.1,
fly.position.z+6.5
);

camera.position.lerp(target,.09);

camera.lookAt(
fly.position.x,
fly.position.y,
fly.position.z-1
);

renderer.render(scene,camera);
}

animate();

// تغيير حجم الشاشة
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
